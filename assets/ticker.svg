  </defs>
  <rect x="0.5" y="0.5" width="1199" height="71" rx="12" fill="url(#tb)" stroke="#22304A"/>
  <text x="22" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#00E585">$</text>
