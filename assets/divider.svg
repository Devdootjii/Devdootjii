<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E585" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E585" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00E585" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="15" x2="1200" y2="15" stroke="#1B2739" stroke-width="1"/>
  <rect x="-200" y="13.5" width="200" height="3" fill="url(#dg)">
    <animate attributeName="x" values="-240;1240" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="15" r="2.5" fill="#00E585">
    <animate attributeName="r" values="2;3.5;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
